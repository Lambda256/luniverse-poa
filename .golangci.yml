version: "2"
run:
  # Several fork test files do not compile (consensus Seal/clique.New
  # signature changes) and core tests have an import cycle.
  tests: false
linters:
  default: none
  enable:
    # goconst was dropped: its v2 findings are style-only (repeated strings),
    # mostly in upstream go-ethereum code.
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
  settings:
    govet:
      disable:
        # Go 1.26 "inline" suggestions; not a correctness check.
        - inline
    staticcheck:
      # Only the former gosimple checks, as in the v1 config.
      checks:
        - S1*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Keep consensus/state-transition code byte-for-byte as in the
      # Luniverse fork of go-ethereum 1.10.15; these are style-only hints.
      - linters:
          - staticcheck
        path: (consensus/clique/clique|consensus/misc/dao|core/state_transition|core/types/transaction)\.go
        text: "S100[49]:"
    paths:
      - third_party$
      - builtin$
      - examples$
      - core/genesis_alloc.go
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - core/genesis_alloc.go
